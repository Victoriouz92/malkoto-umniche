<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!--
    ШАБЛОН: обект  (docs/ASSETS.md)

    Платно 256×256, работна зона 240×240 (8px поле).
    Този пример пълни ~63% от платното, ползва 5 цвята и се познава
    като плътен черен силует.

    Изтрий коментарите преди предаване.
  -->

  <!-- Тяло, основен тон -->
  <path
    d="M128 68 C 96 44, 48 62, 48 118 C 48 172, 92 216, 128 216 C 164 216, 208 172, 208 118 C 208 62, 160 44, 128 68 Z"
    fill="#D8504F"
    stroke="#B23F42"
    stroke-width="8"
    stroke-linejoin="round" />

  <!-- Втори, по-светъл тон вместо градиент. Обем без преливане. -->
  <path
    d="M128 68 C 96 44, 48 62, 48 118 C 48 160, 76 200, 104 212 C 84 190, 76 156, 80 124 C 84 96, 100 76, 128 68 Z"
    fill="#E8706E" />

  <!-- Дръжка: контур със заоблен край, не запълнена форма -->
  <path
    d="M126 68 C 124 52, 130 38, 144 30"
    fill="none"
    stroke="#8A6242"
    stroke-width="10"
    stroke-linecap="round" />

  <!-- Листо -->
  <path
    d="M144 44 C 164 26, 194 28, 198 44 C 188 62, 158 62, 144 44 Z"
    fill="#6FA84E"
    stroke="#54833C"
    stroke-width="6"
    stroke-linejoin="round" />
</svg>
