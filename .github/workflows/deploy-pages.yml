name: Публикуване на сайта

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Изтегляне на проекта
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Инсталиране
        run: npm ci
      - name: Проверка и build
        run: npm run build
      - name: Подготовка за GitHub Pages
        uses: actions/configure-pages@v5
      - name: Качване на сайта
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Публикуване
        id: deployment
        uses: actions/deploy-pages@v4
